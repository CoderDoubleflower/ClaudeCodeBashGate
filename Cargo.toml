[package]
name = "bashgate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A fail-closed Bash structure parser built on tree-sitter-bash"
repository = "https://github.com/CoderDoubleflower/ClaudeCodeBashGate"
keywords = ["bash", "parser", "tree-sitter", "security"]
categories = ["command-line-utilities", "parser-implementations"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.1"

[workspace]
members = ["."]
exclude = ["fuzz"]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
